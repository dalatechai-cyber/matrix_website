<!doctype html>
<html lang="mn">
  <head>
    <!-- @head -->
    <title>Keune бүтээгдэхүүн — Tara Salon</title>
    <meta name="description" content="Keune мэргэжлийн үс арчилгааны бүтээгдэхүүн." />
    <meta property="og:title" content="Keune бүтээгдэхүүн — Tara Salon" />
    <meta property="og:description" content="Keune мэргэжлийн үс арчилгааны бүтээгдэхүүн." />
    <meta property="og:url" content="{{origin}}/keune-products.html" />
    <link rel="canonical" href="{{origin}}/keune-products.html" />
  </head>
  <body>
    <!-- @header -->

    <main id="main">
      <section class="page-intro">
        <div class="container">
          <h1 class="display">Keune Бүтээгдэхүүн</h1>
          <p class="lead">Голланд улсад 1922 оноос хойш үйлдвэрлэгдсэн мэргэжлийн үс арчилгааны дээд зэрэглэлийн бүтээгдэхүүн.</p>
          <nav class="hero-actions" aria-label="Брэнд" style="margin-top:1.75rem">
            <a class="btn btn--outline" href="/products.html">Amos</a>
            <a class="btn btn--primary" href="/keune-products.html" aria-current="page">Keune</a>
          </nav>
        </div>
      </section>

      <section class="section" style="padding-top:2.5rem">
        <div class="container">
          <div class="keune-brand-strip">
            <img src="/Keune/about1.jpeg" alt="Keune брэндийн танилцуулга" class="keune-brand-img" loading="lazy" />
            <img src="/Keune/about2.jpeg" alt="Keune бүтээгдэхүүний танилцуулга" class="keune-brand-img" loading="lazy" />
            <img src="/Keune/about3.jpeg" alt="Keune чанарын танилцуулга" class="keune-brand-img" loading="lazy" />
          </div>
        </div>
      </section>

      <section class="section section--sand">
        <div class="container">
          <div class="section-head">
            <h2 class="h2">Бүтээгдэхүүний шугам</h2>
            <p class="lead">Таны үсний хэрэгцээнд тохирсон 12 төрлийн бүтээгдэхүүн</p>
          </div>
          <div id="keune-filters" class="products-filters" role="group" aria-label="Ангилал"></div>
          <div id="keune-grid" class="keune-grid" aria-live="polite"></div>
        </div>
      </section>

      <section class="section keune-poster">
        <div class="container">
          <h2 class="h2">Бүтээгдэхүүний ерөнхий танилцуулга</h2>
          <img src="/Keune/overallKeuneProducts.png" alt="Keune бүтээгдэхүүний танилцуулга" loading="lazy" />
        </div>
      </section>
    </main>

    <!-- @footer -->
    <div class="book-bar" aria-hidden="true"><a class="btn btn--primary btn--block" href="/booking.html" tabindex="-1">Цаг захиалах</a></div>
    <script src="/assets/site.js?v={{v}}" defer></script>
    <script src="/assets/products.js?v={{v}}" defer></script>
  </body>
</html>
