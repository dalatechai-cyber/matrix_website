<!doctype html>
<html lang="mn">
  <head>
    <!-- @head -->
    <title>Бүтээл — Tara Salon</title>
    <meta name="description" content="Tara Salon-ы үсчдийн хийсэн засалт, будаг, химийн бүтээл." />
    <meta property="og:title" content="Бүтээл — Tara Salon" />
    <meta property="og:description" content="Манай үсчдийн хийсэн засалт, будаг, химийн бүтээл." />
    <meta property="og:url" content="{{origin}}/zurag.html" />
    <link rel="canonical" href="{{origin}}/zurag.html" />
  </head>
  <body>
    <!-- @header -->

    <main id="main">
      <section class="page-intro on-teal">
        <div class="container">
          <h1 class="display">Бүтээл</h1>
          <p class="lead">Манай үсчдийн хийсэн засалт, будаг, химийн ажлаас.</p>
        </div>
      </section>

      <section class="section" style="padding-top:2.5rem">
        <div class="container">
          <div class="filter-row" role="group" aria-label="Шүүлтүүр">
            <button class="chip" type="button" data-filter="all" aria-pressed="true">Бүгд</button>
            <button class="chip" type="button" data-filter="female" aria-pressed="false">Эмэгтэй</button>
            <button class="chip" type="button" data-filter="male" aria-pressed="false">Эрэгтэй</button>
          </div>
          <div class="gallery-grid" data-gallery>
            <button type="button" data-cat="female"><img src="/img/gallery/female-pic2.webp" width="414" height="414" loading="lazy" alt="Мөрөн дээр хүрэх долгиолсон хүрэн үс" /></button>
            <button type="button" data-cat="female"><img src="/img/gallery/female-pic6.webp" width="414" height="414" loading="lazy" alt="Шулуун үсэнд хийсэн тодруулга, өмнө ба дараа" /></button>
            <button type="button" data-cat="female"><img src="/img/gallery/female-pic8.webp" width="414" height="414" loading="lazy" alt="Хар үсэнд хийсэн цайвар тодруулга, долгиолсон хэлбэр" /></button>
            <button type="button" data-cat="female"><img src="/img/gallery/female-pic3.webp" width="414" height="414" loading="lazy" alt="Шаргал богино үс, өмнө ба дараа" /></button>
            <button type="button" data-cat="female"><img src="/img/gallery/female-pic4.webp" width="414" height="414" loading="lazy" alt="Хүрэн өнгийн дунд урттай долгиолсон үс" /></button>
            <button type="button" data-cat="female"><img src="/img/gallery/female-pic5.webp" width="414" height="414" loading="lazy" alt="Хар өнгийн богино долгиолсон үс" /></button>
            <button type="button" data-cat="female"><img src="/img/gallery/female-pic9.webp" width="414" height="414" loading="lazy" alt="Урт долгиолсон хар үс" /></button>
            <button type="button" data-cat="female"><img src="/img/gallery/female-pic10.webp" width="414" height="414" loading="lazy" alt="Урт шулуун хар үс" /></button>
            <button type="button" data-cat="male"><img src="/img/gallery/male-pic1.webp" width="414" height="414" loading="lazy" alt="Эрэгтэй засалт, хөдөлгөөнтэй хэлбэр" /></button>
            <button type="button" data-cat="male"><img src="/img/gallery/male-pic2.webp" width="414" height="414" loading="lazy" alt="Ягаан өнгөөр будсан эрэгтэй богино үс" /></button>
            <button type="button" data-cat="male"><img src="/img/gallery/male-pic3.webp" width="414" height="414" loading="lazy" alt="Цайруулж будсан эрэгтэй үс" /></button>
            <button type="button" data-cat="male"><img src="/img/gallery/male-pic4.webp" width="414" height="414" loading="lazy" alt="Тоорын өнгөөр будсан эрэгтэй үс" /></button>
            <button type="button" data-cat="male"><img src="/img/gallery/male-pic5.webp" width="414" height="414" loading="lazy" alt="Эрэгтэй богино засалт, гөлгөр хэлбэр" /></button>
            <button type="button" data-cat="male"><img src="/img/gallery/male-pic6.webp" width="414" height="414" loading="lazy" alt="Ягаан өнгийн эрэгтэй үс, хажуу тал" /></button>
            <button type="button" data-cat="male"><img src="/img/gallery/male-pic7.webp" width="414" height="414" loading="lazy" alt="Цагаан шаргал өнгөөр будсан эрэгтэй үс" /></button>
            <button type="button" data-cat="male"><img src="/img/gallery/male-pic8.webp" width="414" height="414" loading="lazy" alt="Арагш самнасан эрэгтэй үс" /></button>
            <button type="button" data-cat="male"><img src="/img/gallery/male-pic9.webp" width="900" height="747" loading="lazy" alt="Эрэгтэй хими, буржгар хэлбэр" /></button>
          </div>
          <p style="margin-top:3rem"><a class="btn btn--primary" href="/booking.html">Цаг захиалах</a></p>
        </div>
      </section>
    </main>

    <!-- @footer -->
    <div class="book-bar" aria-hidden="true"><a class="btn btn--primary btn--block" href="/booking.html" tabindex="-1">Цаг захиалах</a></div>
    <script src="/assets/site.js?v={{v}}" defer></script>
  </body>
</html>
