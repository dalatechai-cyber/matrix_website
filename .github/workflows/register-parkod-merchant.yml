name: Register Парк Од QPay merchant

# Manual only. Registers Tara Salon — Парк Од as a second merchant under the
# site's one QPay Quick QR login (docs/TWO_BRANCHES.md). The form (personal
# data: register number, bank account) lives only in the repository secret
# PARKOD_MERCHANT_FORM and is never printed; this repository is public.
# Run once with send=false to check the form, then with send=true.

on:
  workflow_dispatch:
    inputs:
      send:
        description: 'Actually register (false = check the form only)'
        type: boolean
        default: false

jobs:
  register:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Register (or check) the merchant
        env:
          QPAY_USERNAME: ${{ secrets.QPAY_USERNAME }}
          QPAY_PASSWORD: ${{ secrets.QPAY_PASSWORD }}
          FORM: ${{ secrets.PARKOD_MERCHANT_FORM }}
        run: |
          umask 077
          printf '%s' "$FORM" > "$RUNNER_TEMP/parkod.json"
          node scripts/qpay-merchant.js register "$RUNNER_TEMP/parkod.json" ${{ inputs.send && '--send' || '' }} --no-echo
